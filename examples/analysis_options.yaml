include: package:flutter_lints/flutter.yaml

formatter:
  # Narrow enough that snippets never scroll on a phone.
  page_width: 70

analyzer:
  exclude:
    - build/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - require_trailing_commas
